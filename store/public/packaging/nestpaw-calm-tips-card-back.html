<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NestPaw Calm Tips Card — Back</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1024px;
        height: 1536px;
        overflow: hidden;
        background: #f7f8f6;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 1024px;
        height: 1536px;
        padding: 72px 72px 160px;
        color: #1f3d32;
        background:
          radial-gradient(
            ellipse 70% 55% at 0% 0%,
            rgba(138, 168, 153, 0.28),
            transparent 62%
          ),
          radial-gradient(
            ellipse 45% 35% at 8% 22%,
            rgba(47, 107, 85, 0.08),
            transparent 70%
          ),
          #f7f8f6;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, sans-serif;
        text-align: center;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 48px;
      }

      .mark {
        width: 88px;
        height: 88px;
        color: #1f3d32;
      }

      .wordmark {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin-top: -2px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        text-transform: uppercase;
        color: #2f6b55;
      }

      .rule {
        width: 260px;
        height: 1px;
        margin: 0 auto 40px;
        background: rgba(31, 61, 50, 0.35);
      }

      .headline {
        margin: 0 0 16px;
        font-family: "Times New Roman", Times, Georgia, serif;
        font-size: 56px;
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: -0.015em;
        color: #132820;
      }

      .lede {
        margin: 0 0 56px;
        max-width: 560px;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.4;
        color: #5c6b64;
      }

      .qr-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .qr {
        width: 340px;
        height: 340px;
        color: #1f3d32;
      }

      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .scan-label {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        text-transform: uppercase;
        color: #8aa899;
      }

      .url {
        margin-top: 4px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1f3d32;
      }

      .email {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #5c6b64;
      }

      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        text-align: center;
      }

      .footer::before {
        content: "";
        display: block;
        width: 260px;
        height: 1px;
        margin: 0 auto 24px;
        background: rgba(31, 61, 50, 0.35);
      }

      .footer span {
        font-size: 18px;
        letter-spacing: 0.02em;
        color: #5c6b64;
      }
    </style>
  </head>
